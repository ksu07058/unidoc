<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniDoc — Университетские справки без очередей</title>
  <meta
    name="description"
    content="Цифровой сервис университета для онлайн-заказа справок, отслеживания готовности документов и обработки заявок в деканате."
  />
  <meta property="og:title" content="UniDoc — Университетские справки без очередей" />
  <meta
    property="og:description"
    content="Заказывайте необходимые университетские документы онлайн и следите за их готовностью в личном кабинете."
  />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --font-display: "Plus Jakarta Sans", "Manrope", system-ui, -apple-system, sans-serif;
      --font-sans: "Manrope", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --text-main: #0F172A;
      --text-secondary: #334155;
      --text-muted: #475569;
      --text-subtle: #64748B;
      --primary: #1D4ED8;
      --primary-hover: #1E40AF;
      --primary-soft: #EFF6FF;
      --surface-muted: #F8FAFC;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --emerald: #047857;
      --emerald-bg: #ECFDF5;
      --emerald-border: #A7F3D0;
      --amber: #B45309;
      --amber-bg: #FFFBEB;
      --amber-border: #FDE68A;
      --red: #B91C1C;
      --red-bg: #FEF2F2;
      --red-border: #FECACA;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-family: var(--font-sans);
      scroll-behavior: smooth;
      color: var(--text-main);
      background-color: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #FFFFFF;
      color: var(--text-main);
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      margin: 0;
    }

    p {
      margin: 0;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    ul, dl, dd, dt {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    ::selection {
      background-color: #DBEAFE;
      color: #1E3A8A;
    }

    .tabular-nums { font-variant-numeric: tabular-nums; }
    .text-balance { text-wrap: balance; }
    .font-mono { font-family: var(--font-mono); }
    .font-display { font-family: var(--font-display); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Layout containers */
    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1 1 auto;
    }

    .container {
      width: 100%;
      max-width: 72rem;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    .container-narrow {
      width: 100%;
      max-width: 56rem;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    @media (min-width: 640px) {
      .container, .container-narrow {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
    }

    @media (min-width: 1024px) {
      .container, .container-narrow {
        padding-left: 2rem;
        padding-right: 2rem;
      }
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      height: 4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .brand-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      flex-shrink: 0;
      white-space: nowrap;
      text-align: left;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border-radius: 0.5rem;
      background-color: var(--primary);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 700;
    }

    .brand-badge-sm {
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-main);
    }

    .desktop-nav {
      display: none;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .nav-link {
      position: relative;
      padding: 0.25rem 0;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--text-muted);
      transition: color 150ms ease;
    }

    .nav-link:hover {
      color: var(--text-main);
    }

    .nav-link.active {
      color: var(--primary);
      font-weight: 600;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1.3125rem;
      height: 2px;
      background-color: var(--primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .btn-header-login {
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 0.5rem;
      background-color: var(--primary);
      color: #FFFFFF;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background-color 150ms ease;
    }

    .btn-header-login:hover {
      background-color: var(--primary-hover);
    }

    .btn-mobile-menu {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .btn-mobile-menu:hover {
      background-color: var(--surface-muted);
    }

    .mobile-drawer {
      border-top: 1px solid var(--border);
      background-color: #FFFFFF;
      padding: 1rem;
    }

    .mobile-nav-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .mobile-nav-link {
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 0 0.75rem;
      border-radius: 0.5rem;
      text-align: left;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .mobile-nav-link:hover {
      background-color: rgba(239, 246, 255, 0.7);
      color: var(--primary);
    }

    @media (min-width: 768px) {
      .desktop-nav { display: flex; }
      .btn-header-login { display: inline-flex; }
      .btn-mobile-menu { display: none; }
      .mobile-drawer { display: none !important; }
    }

    /* Storage Alert Banner */
    .storage-banner {
      border-bottom: 1px solid #FDE68A;
      background-color: #FFFBEB;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      color: #78350F;
    }

    .storage-banner-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFFFFF;
      border-radius: 0.75rem;
      padding: 0.75rem 1.5rem;
      min-height: 46px;
      font-size: 0.875rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: var(--text-main);
      border: 1px solid var(--border-strong);
      border-radius: 0.75rem;
      padding: 0.75rem 1.5rem;
      min-height: 46px;
      font-size: 0.875rem;
    }

    .btn-secondary:hover {
      border-color: #93C5FD;
      background-color: rgba(239, 246, 255, 0.5);
    }

    .btn-sm-primary {
      background-color: var(--primary);
      color: #FFFFFF;
      border-radius: 0.5rem;
      padding: 0.5rem 0.875rem;
      min-height: 38px;
      font-size: 0.75rem;
    }

    .btn-sm-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-sm-soft {
      background-color: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #BFDBFE;
      border-radius: 0.5rem;
      padding: 0.5rem 0.875rem;
      min-height: 38px;
      font-size: 0.75rem;
    }

    .btn-sm-soft:hover {
      background-color: #DBEAFE;
    }

    .btn-sm-outline {
      background-color: #FFFFFF;
      color: var(--text-main);
      border: 1px solid var(--border-strong);
      border-radius: 0.5rem;
      padding: 0.5rem 0.875rem;
      min-height: 38px;
      font-size: 0.75rem;
    }

    .btn-sm-outline:hover {
      border-color: #93C5FD;
      color: var(--primary);
    }

    .btn-sm-muted {
      background-color: var(--surface-muted);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.5rem 0.875rem;
      min-height: 38px;
      font-size: 0.75rem;
    }

    .btn-sm-muted:hover {
      border-color: #93C5FD;
      color: var(--primary);
    }

    /* Workspace Toolbar */
    .workspace-toolbar {
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
      background-color: var(--surface-muted);
    }

    .toolbar-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }

    .lg-only-inline {
      display: none;
    }

    @media (min-width: 1024px) {
      .lg-only-inline {
        display: inline;
      }
    }

    .role-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    .segmented {
      display: inline-flex;
      align-items: center;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background-color: #FFFFFF;
      padding: 0.25rem;
    }

    .segmented-muted {
      background-color: var(--surface-muted);
    }

    .seg-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      border-radius: 0.375rem;
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .seg-btn:hover {
      color: var(--text-main);
    }

    .seg-btn.active-blue {
      background-color: var(--primary);
      color: #FFFFFF;
    }

    .seg-btn.active-white {
      background-color: #FFFFFF;
      color: var(--text-main);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 0.625rem;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-height: 36px;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background-color: #FFFFFF;
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .tool-btn:hover {
      border-color: #93C5FD;
      color: var(--primary);
    }

    .notif-wrap {
      position: relative;
    }

    .notif-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 0.5rem);
      width: 320px;
      max-width: calc(100vw - 2rem);
      border-radius: 1rem;
      border: 1px solid var(--border);
      background-color: #FFFFFF;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
      z-index: 50;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .notif-dropdown {
        width: 380px;
      }
    }

    .notif-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #F1F5F9;
      padding: 0.75rem 1rem;
    }

    .notif-list {
      max-height: 20rem;
      overflow-y: auto;
    }

    .notif-item {
      width: 100%;
      display: block;
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #F1F5F9;
      transition: background-color 150ms ease;
    }

    .notif-item:last-child {
      border-bottom: none;
    }

    .notif-item.unread {
      background-color: rgba(239, 246, 255, 0.45);
    }

    .notif-item:hover {
      background-color: rgba(239, 246, 255, 0.7);
    }

    /* Sections & Cards */
    .hero-section {
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
      background: linear-gradient(to bottom, rgba(239, 246, 255, 0.65), #FFFFFF 45%, #FFFFFF);
      padding: 3.5rem 0;
    }

    @media (min-width: 640px) {
      .hero-section {
        padding: 5rem 0;
      }
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.5rem;
      align-items: stretch;
    }

    @media (min-width: 1024px) {
      .hero-grid {
        grid-template-columns: repeat(12, 1fr);
        gap: 3rem;
      }
      .hero-left { grid-column: span 6; display: flex; flex-direction: column; justify-content: center; }
      .hero-right { grid-column: span 6; }
    }

    .eyebrow {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--primary);
    }

    .hero-title {
      margin-top: 0.75rem;
      font-size: clamp(2.25rem, 4vw, 3.5rem);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-main);
    }

    .hero-subtitle {
      margin-top: 1.25rem;
      max-width: 36rem;
      font-size: 1rem;
      line-height: 1.65;
      color: var(--text-secondary);
    }

    @media (min-width: 640px) {
      .hero-subtitle { font-size: 1.125rem; }
    }

    .hero-cta-row {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.875rem;
    }

    .hero-meta {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(226, 232, 240, 0.85);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      font-size: 0.75rem;
      color: var(--text-subtle);
    }

    .visual-frame {
      height: 16rem;
      border-radius: 1rem;
      border: 1px solid var(--border);
      overflow: hidden;
      background-color: var(--primary-soft);
    }

    @media (min-width: 640px) {
      .visual-frame { height: 20rem; }
    }

    @media (min-width: 1024px) {
      .visual-frame { height: 100%; min-height: 400px; }
    }

    .advantages-strip {
      margin-top: 3.5rem;
      display: grid;
      grid-template-columns: 1fr;
      border-radius: 1rem;
      border: 1px solid var(--border);
      background-color: #FFFFFF;
      overflow: hidden;
    }

    .adv-item {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .adv-item:last-child {
      border-bottom: none;
    }

    @media (min-width: 640px) {
      .advantages-strip { grid-template-columns: repeat(2, 1fr); }
      .adv-item:nth-child(odd) { border-right: 1px solid var(--border); }
      .adv-item:nth-child(n+3) { border-bottom: none; }
    }

    @media (min-width: 1024px) {
      .advantages-strip { grid-template-columns: repeat(4, 1fr); }
      .adv-item { border-bottom: none; border-right: 1px solid var(--border); }
      .adv-item:last-child { border-right: none; }
    }

    .icon-box {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.5rem;
      background-color: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box-lg {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 0.75rem;
    }

    /* Section blocks */
    .section-block {
      padding: 4rem 0;
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
    }

    @media (min-width: 640px) {
      .section-block { padding: 5rem 0; }
    }

    .section-muted {
      background-color: var(--surface-muted);
      padding: 4rem 0;
    }

    @media (min-width: 640px) {
      .section-muted { padding: 5rem 0; }
    }

    .page-section {
      padding: 2.5rem 0 3.5rem;
    }

    @media (min-width: 640px) {
      .page-section { padding: 3.25rem 0 4rem; }
    }

    .page-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .page-header-row {
        flex-direction: row;
        align-items: flex-end;
      }
    }

    @media (min-width: 1024px) {
      .page-header-lg-row {
        flex-direction: row;
        align-items: center;
      }
    }

    .page-title {
      margin-top: 0.5rem;
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    @media (min-width: 640px) {
      .page-title { font-size: 2.25rem; }
    }

    .how-grid {
      margin-top: 2.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.5rem;
      align-items: stretch;
    }

    @media (min-width: 1024px) {
      .how-grid { grid-template-columns: repeat(12, 1fr); }
      .how-left { grid-column: span 5; }
      .how-right { grid-column: span 7; display: flex; flex-direction: column; justify-content: center; }
    }

    .steps-list {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .step-row {
      display: flex;
      gap: 1.25rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .step-row:last-child {
      border-bottom: none;
    }

    .cards-grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .cards-grid-2 { grid-template-columns: repeat(2, 1fr); }
    }

    .cards-grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .cards-grid-3 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1024px) {
      .cards-grid-3 { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      border-radius: 1rem;
      border: 1px solid var(--border);
      background-color: #FFFFFF;
      padding: 1.5rem;
      transition: box-shadow 150ms ease, border-color 150ms ease;
    }

    .card-hover:hover {
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .card-flex {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .action-strip {
      margin-top: 3rem;
      border-radius: 1rem;
      border: 1px solid #BFDBFE;
      background-color: rgba(239, 246, 255, 0.85);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
    }

    @media (min-width: 640px) {
      .action-strip {
        flex-direction: row;
        align-items: center;
        padding: 2rem;
      }
    }

    /* Inputs & Forms */
    .input-wrap {
      position: relative;
      width: 100%;
    }

    .input-icon {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalizeSearchText(value) {
        return String(value || '').toLowerCase().replace(/ё/g, 'е').trim();
      }

      function formatRussianDate(isoString, includeTime) {
        if (includeTime === undefined) includeTime = true;
        try {
          var date = new Date(isoString);
          if (isNaN(date.getTime())) return '—';
          var opts = { day: '2-digit', month: 'long', year: 'numeric' };
          if (includeTime) {
            opts.hour = '2-digit';
            opts.minute = '2-digit';
          }
          return new Intl.DateTimeFormat('ru-RU', opts).format(date);
        } catch (e) {
          return '—';
        }
      }

      function formatShortDate(isoString) {
        try {
          var date = new Date(isoString);
          if (isNaN(date.getTime())) return '—';
          return new Intl.DateTimeFormat('ru-RU', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }).format(date);
        } catch (e) {
          return '—';
        }
      }

      function isStorageAvailable() {
        try {
          var testKey = '__unidoc_storage_test__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
          return true;
        } catch (e) {
          return false;
        }
      }

      function dedupeRequests(items) {
        var seenIds = new Set();
        var seenNumbers = new Set();
        var result = [];
        for (var i = 0; i < items.length; i++) {
          var item = items[i];
          if (!item || typeof item.id !== 'string' || typeof item.requestNumber !== 'string') continue;
          var numKey = item.requestNumber.trim().toUpperCase();
          if (seenIds.has(item.id) || seenNumbers.has(numKey)) continue;
          seenIds.add(item.id);
          seenNumbers.add(numKey);
          result.push(item);
        }
        return result;
      }

      function loadRequestsFromStorage() {
        if (!isStorageAvailable()) {
          return {
            data: createInitialDemoRequests(),
            error: 'Хранилище localStorage недоступно в этом браузере. Изменения будут действовать только до перезагрузки страницы.'
          };
        }
        try {
          var raw = window.localStorage.getItem(STORAGE_KEYS.REQUESTS);
          if (!raw) {
            var initial = createInitialDemoRequests();
            window.localStorage.setItem(STORAGE_KEYS.REQUESTS, JSON.stringify(initial));
            return { data: initial, error: null };
          }
          var parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) throw new Error('Invalid format');
          return { data: dedupeRequests(parsed), error: null };
        } catch (e) {
          var fallback = createInitialDemoRequests();
          try {
            window.localStorage.setItem(STORAGE_KEYS.REQUESTS, JSON.stringify(fallback));
          } catch (err) {}
          return {
            data: fallback,
            error: 'Не удалось прочитать сохранённые заявки — восстановлены демонстрационные данные.'
          };
        }
      }

        if (!isStorageAvailable()) return 'Хранилище браузера отключено. Невозможно сохранить изменения.';
        try {
          window.localStorage.setItem(STORAGE_KEYS.REQUESTS, JSON.stringify(requests));
          return null;

          return 'Ошибка сохранения данных в localStorage (возможно, превышен лимит памяти браузера).';

      function loadProfileFromStorage() {
        if (!isStorageAvailable()) return Object.assign({}, DEFAULT_STUDENT_PROFILE);
        try {
          var raw = window.localStorage.getItem(STORAGE_KEYS.PROFILE);
          if (!raw) {
            window.localStorage.setItem(STORAGE_KEYS.PROFILE, JSON.stringify(DEFAULT_STUDENT_PROFILE));
            return Object.assign({}, DEFAULT_STUDENT_PROFILE);
          }
          var parsed = JSON.parse(raw);
          if (!parsed || !parsed.fullName || !parsed.group) return Object.assign({}, DEFAULT_STUDENT_PROFILE);
          return {
            fullName: parsed.fullName,
            group: parsed.group,
            faculty: parsed.faculty || DEFAULT_STUDENT_PROFILE.faculty
          };
        } catch (e) {
          return Object.assign({}, DEFAULT_STUDENT_PROFILE);
        }
      }

      function saveProfileToStorage(profile) {
        if (!isStorageAvailable()) return 'Хранилище браузера недоступно.';
        try {
          window.localStorage.setItem(STORAGE_KEYS.PROFILE, JSON.stringify(profile));
          return null;
        } catch (e) {
          return 'Не удалось сохранить профиль в localStorage.';
        }
      }

      function loadRoleFromStorage() {
        if (!isStorageAvailable()) return 'student';
        try {
          return window.localStorage.getItem(STORAGE_KEYS.ROLE) === 'staff' ? 'staff' : 'student';
        } catch (e) {
          return 'student';
        }
      }

      function saveRoleToStorage(role) {
        if (!isStorageAvailable()) return;
        try {
          window.localStorage.setItem(STORAGE_KEYS.ROLE, role);
        } catch (e) {}
      }

      function generateUniqueRequestNumber(existingRequests) {
        var year = new Date().getFullYear();
        var existingSet = new Set(existingRequests.map(function (r) { return r.requestNumber.toUpperCase(); }));
        for (var attempt = 0; attempt < 100; attempt++) {
          var num = Math.floor(1004 + Math.random() * 8995);
          var candidate = 'UD-' + year + '-' + num;
          if (!existingSet.has(candidate)) return candidate;
        }
        return 'UD-' + year + '-' + String(Date.now()).slice(-5);
      }

      // =========================================================================
      // 3. Генератор PDF-документа (Canvas A4 -> бинарный PDF 1.4 без библиотек)
      // =========================================================================
      function wrapCanvasText(ctx, text, maxWidth) {
        var words = String(text || '').split(/\s+/).filter(Boolean);
        var lines = [];
        var currentLine = '';
        for (var i = 0; i < words.length; i++) {
          var word = words[i];
          var testLine = currentLine ? currentLine + ' ' + word : word;
          if (ctx.measureText(testLine).width > maxWidth && currentLine) {
            lines.push(currentLine);
            currentLine = word;
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) lines.push(currentLine);
        return lines;
      }

      function buildPdfFromJpeg(jpegBytes, imgWidth, imgHeight) {
        var encoder = new TextEncoder();
        var pageWidth = 595.28;
        var pageHeight = 841.89;
        var contentStreamStr = 'q\n' + pageWidth.toFixed(2) + ' 0 0 ' + pageHeight.toFixed(2) + ' 0 0 cm\n/Im0 Do\nQ\n';
        var contentStreamBytes = encoder.encode(contentStreamStr);
        var chunks = [];
        var offsets = [];
        var currentOffset = 0;

        function pushBytes(bytes) {
          chunks.push(bytes);
          currentOffset += bytes.length;
        }
        function pushStr(str) {
          pushBytes(encoder.encode(str));
        }

        pushStr('%PDF-1.4\n%\xFF\xFF\xFF\xFF\n');

        offsets.push(currentOffset);
        pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

        offsets.push(currentOffset);
        pushStr('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');

        offsets.push(currentOffset);
        pushStr('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageWidth.toFixed(2) + ' ' + pageHeight.toFixed(2) + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n');

        offsets.push(currentOffset);
        pushStr('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + imgWidth + ' /Height ' + imgHeight + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpegBytes.length + ' >>\nstream\n');
        pushBytes(jpegBytes);
        pushStr('\nendstream\nendobj\n');

        offsets.push(currentOffset);
        pushStr('5 0 obj\n<< /Length ' + contentStreamBytes.length + ' >>\nstream\n');
        pushBytes(contentStreamBytes);
        pushStr('endstream\nendobj\n');

        var xrefOffset = currentOffset;
        pushStr('xref\n0 ' + (offsets.length + 1) + '\n');
        pushStr('0000000000 65535 f \n');
        for (var i = 0; i < offsets.length; i++) {
          pushStr(String(offsets[i]).padStart(10, '0') + ' 00000 n \n');
        }
        pushStr('trailer\n<< /Size ' + (offsets.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF');

        return new Blob(chunks, { type: 'application/pdf' });
      }

        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(112, 232);

        ctx.stroke();

        var formedDate = formatRussianDate(request.updatedAt, true);
        ctx.fillStyle = '#64748B';

        ctx.fillStyle = '#0F172A';
        ctx.font = 'bold 40px "Plus Jakarta Sans", Arial, sans-serif';
        var titleLines = wrapCanvasText(ctx, request.certificateTitle.toUpperCase(), width - 224);
        var y = 430;
        titleLines.forEach(function (line) {
          ctx.fillText(line, 112, y);
          y += 52;
        });

        y += 28;
        var boxTop = y;
        ctx.fillStyle = '#F8FAFC';
        ctx.fillRect(112, boxTop, width - 224, 340);
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 2;
        ctx.strokeRect(112, boxTop, width - 224, 340);

        function drawField(label, value, rowY) {
          ctx.fillStyle = '#64748B';
          ctx.font = '18px "Manrope", Arial, sans-serif';
          ctx.fillText(label, 148, rowY);
          ctx.fillStyle = '#0F172A';
          ctx.font = 'bold 24px "Manrope", Arial, sans-serif';
          ctx.fillText(value, 148, rowY + 34);

        drawField('ФИО студента', request.studentName, boxTop + 56);

        ctx.fillStyle = '#64748B';

        ctx.fillStyle = '#64748B';
        ctx.font = '18px "Manrope", Arial, sans-serif';

        ctx.fillStyle = '#047857';
        ctx.font = 'bold 24px "Manrope", Arial, sans-serif';
        ctx.fillText('Справка готова', 680, boxTop + 182);

        y = boxTop + 410;
        ctx.fillStyle = '#1E293B';
        ctx.font = '24px "Manrope", Arial, sans-serif';
        var mainParagraph = 'Настоящим подтверждается, что ' + request.studentName + ' (учебная группа ' + request.studentGroup + ') числится в контингенте обучающихся университета. Документ сформирован по электронной заявке № ' + request.requestNumber + '.';
        wrapCanvasText(ctx, mainParagraph, width - 224).forEach(function (line) {
          ctx.fillText(line, 112, y);

        y += 28;
        ctx.fillStyle = '#475569';
        ctx.font = '600 20px "Manrope", Arial, sans-serif';

          ctx.fillStyle = '#0F172A';
          ctx.font = '22px "Manrope", Arial, sans-serif';
          wrapCanvasText(ctx, request.staffComment, width - 224).forEach(function (line) {
            ctx.fillText(line, 112, y);
            y += 34;

        }

        var stampY = height - 340;
        ctx.strokeStyle = '#1D4ED8';
        ctx.lineWidth = 3;
        ctx.strokeRect(112, stampY, 540, 150);
        ctx.fillStyle = '#EFF6FF';
        ctx.fillRect(114, stampY + 2, 536, 146);

        ctx.fillStyle = '#1D4ED8';

        ctx.font = '18px "JetBrains Mono", monospace';
        ctx.fillText('Заявка: ' + request.requestNumber, 142, stampY + 84);
        ctx.fillText('Дата: ' + formedDate, 142, stampY + 116);

        ctx.fillStyle = '#64748B';
        ctx.font = '17px "Manrope", Arial, sans-serif';
        ctx.fillText('Учебный демонстрационный PDF-документ. Не является официальным бланком государственного образца.', 112, height - 110);

        var dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        var base64 = dataUrl.split(',')[1];
        var binaryStr = atob(base64);
        var jpegBytes = new Uint8Array(binaryStr.length);
        for (var i = 0; i < binaryStr.length; i++) {
          jpegBytes[i] = binaryStr.charCodeAt(i);
        }

        var pdfBlob = buildPdfFromJpeg(jpegBytes, width, height);
        var url = URL.createObjectURL(pdfBlob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'UniDoc_' + request.requestNumber + '.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }

          case 'В обработке':

          case 'Готова':
            return { label: 'Готова', cls: 'status-emerald', icon: 'CheckCircle2' };
          case 'Отклонена':
          default:
            return { label: 'Отклонена', cls: 'status-red', icon: 'XCircle' };

      function renderStatusInline(status) {
        var meta = getStatusMeta(status);

      // =========================================================================
      // 5. Состояние приложения (State)
      // =========================================================================
      function parseRouteFromHash() {
        try {
          var rawHash = window.location.hash.replace(/^#/, '');
          if (!rawHash) return { route: 'home', trackNumber: '' };
          var parts = rawHash.split('?');
          var route = VALID_ROUTES.indexOf(parts[0]) !== -1 ? parts[0] : 'home';
          var params = new URLSearchParams(parts[1] || '');
          return { route: route, trackNumber: params.get('num') || '' };
        } catch (e) {
          return { route: 'home', trackNumber: '' };
        }
      }

      var initialHash = parseRouteFromHash();
      var initialReqState = loadRequestsFromStorage();

      var state = {
        route: initialHash.route,
        role: loadRoleFromStorage(),
        requests: initialReqState.data,
        storageError: initialReqState.error,
        studentProfile: loadProfileFromStorage(),
        notifications: loadNotificationsFromStorage(),
        toasts: [],

        // UI flags
        mobileMenuOpen: false,
        notifOpen: false,
        isAuthModalOpen: false,
        previewRequest: null,

        // Page-specific state
        certSearchQuery: '',

        // Order form state
        orderName: '',
        orderGroup: '',
        orderCertId: 'study_place',
        orderPurpose: CERTIFICATE_MAP['study_place'].defaultPurpose,
        orderDelivery: 'Электронная копия',
        orderComment: '',
        orderFieldErrors: {},
        orderSubmitError: null,
        orderCreatedRequest: null,
        orderCopied: false,

        // Track page state
        trackInput: initialHash.trackNumber || '',
        trackSearched: initialHash.trackNumber || '',
        trackError: null,

        // Student dashboard state
        studentScope: 'all',
        studentStatusFilter: 'Все',
        studentSearch: '',
        studentExpandedId: null,
        editingProfile: false,
        draftProfileName: '',
        draftProfileGroup: '',
        profileError: null,

        // Staff dashboard state
        staffSearch: '',
        staffStatusFilter: 'Все',
        staffSelectedId: initialReqState.data[0] ? initialReqState.data[0].id : '',
        staffEditStatus: initialReqState.data[0] ? initialReqState.data[0].status : 'Новая',
        staffEditComment: initialReqState.data[0] ? initialReqState.data[0].staffComment : '',
        staffSaveError: null,
        staffSaveSuccess: null,

        // Auth modal draft
        authName: '',
        authGroup: '',
        authError: null
      };

      state.orderName = state.studentProfile.fullName;
      state.orderGroup = state.studentProfile.group;
      state.draftProfileName = state.studentProfile.fullName;
      state.draftProfileGroup = state.studentProfile.group;
      state.authName = state.studentProfile.fullName;
      state.authGroup = state.studentProfile.group;

      function writeHashForRoute(route, trackNumber) {
        try {
          var nextHash = route === 'track' && trackNumber
            ? '#track?num=' + encodeURIComponent(trackNumber)
            : '#' + route;
          if (window.location.hash !== nextHash) {
            window.history.replaceState(null, '', nextHash);
          }
        } catch (e) {}
      }

      function pushToast(toast) {
        var id = 'toast-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
        state.toasts = [Object.assign({ id: id }, toast)].concat(state.toasts).slice(0, 4);
        renderToastsOnly();
        window.setTimeout(function () {
          dismissToast(id);
        }, 6500);
      }

      function dismissToast(id) {
        state.toasts = state.toasts.filter(function (t) { return t.id !== id; });
        renderToastsOnly();
      }

      function appendNotification(notif) {
        var entry = Object.assign({}, notif, {
          id: 'notif-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          createdAt: new Date().toISOString(),
          read: false
        });
        state.notifications = [entry].concat(state.notifications).slice(0, 40);
        saveNotificationsToStorage(state.notifications);
      }

      function navigate(to, options) {
        options = options || {};
        if (options.certificateId && CERTIFICATE_MAP[options.certificateId]) {
          state.orderCertId = options.certificateId;
          if (!state.orderCreatedRequest) {
            state.orderPurpose = CERTIFICATE_MAP[options.certificateId].defaultPurpose;
          }
        }
        if (options.trackNumber !== undefined) {
          state.trackInput = options.trackNumber;
          state.trackSearched = options.trackNumber;
          state.trackError = null;
        }
        state.route = to;
        state.mobileMenuOpen = false;
        state.notifOpen = false;
        writeHashForRoute(to, options.trackNumber);
        render();

        if (options.scrollToId) {
          window.setTimeout(function () {
            var el = document.getElementById(options.scrollToId);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 60);
        } else {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      function setRole(nextRole, navigateToDashboard) {
        state.role = nextRole;
        saveRoleToStorage(nextRole);
        if (navigateToDashboard) {
          navigate(nextRole === 'staff' ? 'staff' : 'student');
        } else if (state.route === 'student' && nextRole === 'staff') {
          navigate('staff');
        } else if (state.route === 'staff' && nextRole === 'student') {
          navigate('student');
        } else {
          render();
        }
        pushToast({
          title: nextRole === 'staff' ? 'Режим сотрудника деканата' : 'Режим студента',
          message: nextRole === 'staff'
            ? 'Открыта панель управления заявками деканата.'
            : 'Вы переключились в личный кабинет студента.',
          variant: 'info'
        });
      }

      function updateStudentProfile(profile) {
        var cleaned = {
          fullName: profile.fullName.trim(),
          group: profile.group.trim().toUpperCase(),
          faculty: (profile.faculty || DEFAULT_STUDENT_PROFILE.faculty).trim()
        };
        state.studentProfile = cleaned;
        state.orderName = cleaned.fullName;
        state.orderGroup = cleaned.group;
        var err = saveProfileToStorage(cleaned);
        if (err) {
          state.storageError = err;
        } else {
          pushToast({
            title: 'Профиль обновлён',
            message: cleaned.fullName + ' · ' + cleaned.group,
            variant: 'success'
          });
        }
      }

      function createRequest(input) {
        var trimmedName = input.studentName.trim();
        var trimmedGroup = input.studentGroup.trim().toUpperCase();
        var trimmedPurpose = input.purpose.trim();

        if (trimmedName.length < 3) return { ok: false, error: 'Укажите корректное ФИО (минимум 3 символа).' };
        if (trimmedGroup.length < 2) return { ok: false, error: 'Укажите номер учебной группы.' };
        if (trimmedPurpose.length < 4) return { ok: false, error: 'Укажите цель получения справки.' };

        var cert = CERTIFICATE_MAP[input.certificateTypeId];
        if (!cert) return { ok: false, error: 'Выбран некорректный тип справки.' };

        var nowMs = Date.now();
        var nowIso = new Date(nowMs).toISOString();
        var requestNumber = generateUniqueRequestNumber(state.requests);

        var newRequest = {
          id: 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          requestNumber: requestNumber,
          studentName: trimmedName,
          studentGroup: trimmedGroup,
          certificateTypeId: input.certificateTypeId,
          certificateTitle: cert.title,
          purpose: trimmedPurpose,
          deliveryMethod: input.deliveryMethod,
          studentComment: input.studentComment.trim(),
          status: 'Новая',
          staffComment: '',
          createdAt: nowIso,
          updatedAt: nowIso,
          history: [
            {
              status: 'Новая',
              timestamp: nowIso,
              note: 'Заявка ' + requestNumber + ' создана и отправлена в деканат.',
              actor: 'Студент'
            }
          ]
        };

        var nextRequests = [newRequest].concat(state.requests);
        var saveErr = saveRequestsToStorage(nextRequests);
        if (saveErr) {
          state.storageError = saveErr;
          return { ok: false, error: saveErr };
        }

        state.requests = nextRequests;
        if (trimmedName !== state.studentProfile.fullName || trimmedGroup !== state.studentProfile.group) {
          var updatedProfile = Object.assign({}, state.studentProfile, {
            fullName: trimmedName,
            group: trimmedGroup
          });
          state.studentProfile = updatedProfile;
          saveProfileToStorage(updatedProfile);
        }

        appendNotification({
          requestNumber: requestNumber,
          title: 'Новая заявка зарегистрирована',
          message: 'Заявка ' + requestNumber + ' (' + cert.shortTitle + ') принята и ожидает обработки в деканате.',
          status: 'Новая',
          targetRole: 'all'
        });

        pushToast({
          title: 'Заявка ' + requestNumber + ' отправлена',
          message: cert.title + ' · статус «Новая»',
          variant: 'success',
          requestNumber: requestNumber
        });

        return { ok: true, request: newRequest };
      }

      function updateRequestStatus(input) {
        var target = state.requests.find(function (r) { return r.id === input.id; });
        if (!target) return { ok: false, error: 'Заявка не найдена в хранилище.' };

        var trimmedComment = input.staffComment.trim();
        if (input.status === 'Отклонена' && trimmedComment.length < 5) {
          return {
            ok: false,
            error: 'При отклонении заявки обязательно укажите причину в комментарии сотрудника.'
          };
        }

        var nowIso = new Date().toISOString();
        var statusChanged = target.status !== input.status;
        var defaultNoteByStatus = {
          'Новая': 'Заявка возвращена в статус «Новая».',
          'В обработке': 'Сотрудник деканата взял заявку в работу.',
          'Готова': target.deliveryMethod === 'Электронная копия'
            ? 'Обработка заявки завершена. Электронная справка PDF сформирована и доступна для скачивания.'
            : 'Обработка заявки завершена. Бумажный оригинал подписан и готов к выдаче в каб. 214.',
          'Отклонена': trimmedComment || 'Заявка отклонена сотрудником деканата.'
        };

        var historyNote = input.status === 'Готова' && trimmedComment
          ? (/^обработка/i.test(trimmedComment) ? trimmedComment : 'Обработка заявки завершена. ' + trimmedComment)
          : (trimmedComment || defaultNoteByStatus[input.status]);

        var nextHistory = statusChanged
          ? target.history.concat([{
              status: input.status,
              timestamp: nowIso,
              note: historyNote,
              actor: 'Деканат'
            }])
          : target.history.map(function (item, idx) {
              return idx === target.history.length - 1
                ? Object.assign({}, item, { note: historyNote, timestamp: nowIso })
                : item;
            });

        var updated = Object.assign({}, target, {
          status: input.status,
          staffComment: trimmedComment,
          updatedAt: nowIso,
          history: nextHistory
        });

        var nextRequests = state.requests.map(function (r) { return r.id === target.id ? updated : r; });
        var saveErr = saveRequestsToStorage(nextRequests);
        if (saveErr) {
          state.storageError = saveErr;
          return { ok: false, error: saveErr };
        }

        state.requests = nextRequests;

        var notifTitle = input.status === 'Готова'
          ? 'Справка готова!'
          : input.status === 'Отклонена'
            ? 'Заявка отклонена'
            : input.status === 'В обработке'
              ? 'Заявка в обработке'
              : 'Заявка обновлена';

        appendNotification({
          requestNumber: updated.requestNumber,
          title: notifTitle + ' · ' + updated.requestNumber,
          message: updated.certificateTitle + ' (' + updated.studentName + ') — статус: «' + updated.status + '».' + (trimmedComment ? ' Комментарий: ' + trimmedComment : ''),
          status: updated.status,
          targetRole: 'student'
        });

        pushToast({
          title: notifTitle + ' (' + updated.requestNumber + ')',
          message: 'Статус обновлён на «' + updated.status + '». Изменение сразу доступно студенту и в поиске.',
          variant: updated.status === 'Готова' ? 'success' : updated.status === 'Отклонена' ? 'error' : 'info',
          requestNumber: updated.requestNumber
        });

        return { ok: true, request: updated };
      }

      function resetDemoData() {
        var requests = createInitialDemoRequests();
        var notifications = createInitialDemoNotifications();
        var profile = Object.assign({}, DEFAULT_STUDENT_PROFILE);

        if (isStorageAvailable()) {
          try {
            window.localStorage.setItem(STORAGE_KEYS.REQUESTS, JSON.stringify(requests));
            window.localStorage.setItem(STORAGE_KEYS.NOTIFICATIONS, JSON.stringify(notifications));
            window.localStorage.setItem(STORAGE_KEYS.PROFILE, JSON.stringify(profile));
          } catch (e) {
            state.storageError = 'Не удалось записать сброшенные данные в localStorage.';
          }
        } else {
          state.storageError = 'localStorage недоступен, данные сброшены только в текущей сессии.';
        }

        state.requests = requests;
        state.notifications = notifications;
        state.studentProfile = profile;
        state.orderName = profile.fullName;
        state.orderGroup = profile.group;
        state.staffSelectedId = requests[0].id;
        state.staffEditStatus = requests[0].status;
        state.staffEditComment = requests[0].staffComment;
        state.staffSaveSuccess = null;
        state.staffSaveError = null;
        render();

        pushToast({
          title: 'Демонстрационные данные сброшены',
          message: 'Загружены 3 базовые заявки: «Новая», «В обработке» и «Готова».',
          variant: 'info'
        });
      }

      function renderHeader() {
        var navItems = [
          { label: 'Главная', target: 'home' },

        var desktopLinks = navItems.map(function (item) {
          var isActive = !item.scrollToId && (
            (item.target === 'home' && state.route === 'home') ||
            (item.target === 'certificates' && state.route === 'certificates') ||
            (item.target === 'track' && state.route === 'track') ||
            ((item.target === 'student' || item.target === 'staff') && (state.route === 'student' || state.route === 'staff'))

      function renderWorkspaceToolbar() {
        var unreadCount = state.notifications.filter(function (n) { return !n.read; }).length;
        var dropdownHtml = '';
        if (state.notifOpen) {
          var listHtml = state.notifications.length === 0
            ? '<div style="padding:2rem 1rem;text-align:center;font-size:0.75rem;color:#64748B;">Пока нет уведомлений о заявках.</div>'
            : state.notifications.slice(0, 12).map(function (item) {

      function renderStatusTimeline(request) {

                '</div>' +

              '</div>' +

              '<p style="font-size:0.75rem;font-weight:600;color:#991B1B;">Причина отклонения</p>' +

        var stages = [
          { status: 'Новая', label: 'Новая', icon: 'FilePlus2', description: 'Заявка зарегистрирована и поступила в электронную приёмную' },

        ];
        var orderMap = { 'Новая': 0, 'В обработке': 1, 'Готова': 2 };
        var currentIndex = orderMap[request.status] !== undefined ? orderMap[request.status] : 0;

        return '<div class="timeline-grid">' +
          stages.map(function (stage, index) {

      function renderToastsHtml() {

          state.toasts.map(function (t) {
            var icon = t.variant === 'success' ? 'CheckCircle2' : t.variant === 'error' ? 'AlertCircle' : 'Info';
            var color = t.variant === 'success' ? '#059669' : t.variant === 'error' ? '#DC2626' : '#1D4ED8';
            return '<div class="toast-card">' +
              '<span style="color:' + color + ';margin-top:2px;flex-shrink:0;">' + svgIcon(icon, 20) + '</span>' +
              '<div style="flex:1;min-width:0;">' +
                '<p style="font-size:0.875rem;font-weight:600;color:#0F172A;">' + escapeHtml(t.title) + '</p>' +
                '<p style="margin-top:0.15rem;font-size:0.75rem;line-height:1.45;color:#475569;">' + escapeHtml(t.message) + '</p>' +
                (t.requestNumber
                  ? '<button type="button" data-action="toast-track" data-toast-id="' + escapeHtml(t.id) + '" data-num="' + escapeHtml(t.requestNumber) + '" style="margin-top:0.5rem;font-size:0.75rem;font-weight:600;color:#1D4ED8;">Открыть статус заявки →</button>'
                  : '') +
              '</div>' +
              '<button type="button" data-action="dismiss-toast" data-toast-id="' + escapeHtml(t.id) + '" aria-label="Закрыть уведомление" style="padding:0.25rem;color:#94A3B8;">' + svgIcon('X', 16) + '</button>' +
            '</div>';
          }).join('') +
        '</div>';

      function renderToastsOnly() {
        var holder = document.getElementById('toast-holder');
        if (holder) holder.innerHTML = renderToastsHtml();

      function render() {
        var active = document.activeElement;
        var focusAttr = active && active.getAttribute('data-input');
        var selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
        var selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

        var storageBanner = state.storageError
          ? '<div role="alert" class="storage-banner">' +
              '<div class="container storage-banner-inner">' +
                '<div style="display:flex;align-items:center;gap:0.5rem;">' + svgIcon('AlertTriangle', 16) + '<span>' + escapeHtml(state.storageError) + '</span></div>' +
                '<button type="button" data-action="clear-storage-error" aria-label="Скрыть предупреждение" style="padding:0.25rem;">' + svgIcon('X', 14) + '</button>' +
              '</div>' +
            '</div>'
          : '';

        var pageHtml = '';
        switch (state.route) {
          case 'certificates': pageHtml = renderCertificatesPage(); break;
          case 'student': pageHtml = renderStudentDashboard(); break;
          case 'order': pageHtml = renderOrderPage(); break;
          case 'track': pageHtml = renderTrackPage(); break;
          case 'staff': pageHtml = renderStaffDashboard(); break;
          case 'home':
          default: pageHtml = renderHomePage(); break;
        }

        document.getElementById('app').innerHTML =
          renderHeader() +
          storageBanner +
          '<main class="main-content">' + pageHtml + '</main>' +
          renderFooter() +
          renderAuthModal() +
          renderPreviewModal() +
          '<div id="toast-holder">' + renderToastsHtml() + '</div>';

        // Восстановление фокуса при перерисовке текстовых полей поиска
        if (focusAttr) {
          var restored = document.querySelector('[data-input="' + focusAttr + '"]');
          if (restored) {
            restored.focus();
            if (selStart !== null && typeof restored.setSelectionRange === 'function') {
              try { restored.setSelectionRange(selStart, selEnd); } catch (e) {}
            }
          }
        }
      }

      // =========================================================================
      // 7. Делегирование событий (Click, Input, Change, Submit, Cross-tab sync)
      // =========================================================================
      var appRoot = document.getElementById('app');

      appRoot.addEventListener('click', function (e) {
        var target = e.target.closest('[data-action]');
        if (!target) return;
        var action = target.getAttribute('data-action');

        switch (action) {
          case 'nav':
            navigate(target.getAttribute('data-target'), {
              scrollToId: target.getAttribute('data-scroll') || undefined
            });
            break;
          case 'order-cert':
            state.orderCreatedRequest = null;
            navigate('order', { certificateId: target.getAttribute('data-cert') });
            break;
          case 'track-num':
            navigate('track', { trackNumber: target.getAttribute('data-num') || '' });
            break;
          case 'toggle-mobile-menu':
            state.mobileMenuOpen = !state.mobileMenuOpen;
            render();
            break;
          case 'open-auth':
            state.authName = state.studentProfile.fullName;
            state.authGroup = state.studentProfile.group;
            state.authError = null;
            state.isAuthModalOpen = true;
            state.mobileMenuOpen = false;
            render();
            break;
          case 'close-auth':
          case 'backdrop-close-auth':
            state.isAuthModalOpen = false;
            render();
            break;
          case 'auth-student': {
            var n = state.authName.trim();
            var g = state.authGroup.trim();
            if (n.length < 3 || g.length < 2) {
              state.authError = 'Укажите ФИО и учебную группу для входа в кабинет студента.';
              render();
              return;
            }
            state.authError = null;
            updateStudentProfile(Object.assign({}, state.studentProfile, { fullName: n, group: g }));
            state.isAuthModalOpen = false;
            setRole('student', true);
            break;
          }
          case 'auth-staff':
            state.authError = null;
            state.isAuthModalOpen = false;
            setRole('staff', true);
            break;
          case 'switch-role':
            setRole(target.getAttribute('data-role'), true);
            break;
          case 'toggle-notif':
            state.notifOpen = !state.notifOpen;
            render();
            break;
          case 'mark-all-read':
            state.notifications = state.notifications.map(function (n) { return Object.assign({}, n, { read: true }); });
            saveNotificationsToStorage(state.notifications);
            render();
            break;
          case 'open-notif': {
            var nid = target.getAttribute('data-id');
            state.notifications = state.notifications.map(function (n) {
              return n.id === nid ? Object.assign({}, n, { read: true }) : n;
            });
            saveNotificationsToStorage(state.notifications);
            state.notifOpen = false;
            navigate('track', { trackNumber: target.getAttribute('data-num') || '' });
            break;
          }
          case 'reset-demo':
            resetDemoData();
            break;
          case 'clear-storage-error':
            state.storageError = null;
            render();
            break;
          case 'clear-cert-search':
            state.certSearchQuery = '';
            render();
            break;
          case 'pick-purpose':
            state.orderPurpose = target.getAttribute('data-purpose') || '';
            delete state.orderFieldErrors.purpose;
            render();
            break;
          case 'pick-delivery':
            state.orderDelivery = target.getAttribute('data-delivery');
            render();
            break;
          case 'copy-req-num':
            if (state.orderCreatedRequest && navigator.clipboard) {
              navigator.clipboard.writeText(state.orderCreatedRequest.requestNumber).then(function () {
                state.orderCopied = true;
                render();
                window.setTimeout(function () {
                  state.orderCopied = false;
                  render();
                }, 2000);
              }).catch(function () {});
            }
            break;
          case 'order-another':
            state.orderCreatedRequest = null;
            state.orderComment = '';
            state.orderFieldErrors = {};
            state.orderSubmitError = null;
            render();
            break;
          case 'download-pdf': {
            var rId = target.getAttribute('data-id');
            var req = state.requests.find(function (r) { return r.id === rId; });
            if (req) {
              try {
                downloadCertificatePdf(req);
                pushToast({
                  title: 'PDF сформирован (' + req.requestNumber + ')',
                  message: 'Файл UniDoc_' + req.requestNumber + '.pdf загружен.',
                  variant: 'success'
                });
              } catch (err) {
                pushToast({
                  title: 'Ошибка формирования PDF',
                  message: 'Используйте кнопку предпросмотра для печати документа.',
                  variant: 'error'
                });
              }
            }
            break;
          }
          case 'preview-pdf': {
            var pId = target.getAttribute('data-id');
            state.previewRequest = state.requests.find(function (r) { return r.id === pId; }) || null;
            render();
            break;
          }
          case 'close-preview':
          case 'backdrop-close-preview':
            state.previewRequest = null;
            render();
            break;
          case 'print-preview':
            window.print();
            break;
          case 'toggle-edit-profile':
            state.draftProfileName = state.studentProfile.fullName;
            state.draftProfileGroup = state.studentProfile.group;
            state.profileError = null;
            state.editingProfile = !state.editingProfile;
            render();
            break;
          case 'cancel-profile':
            state.editingProfile = false;
            render();
            break;
          case 'student-scope':
            state.studentScope = target.getAttribute('data-scope');
            render();
            break;
          case 'student-status':
            state.studentStatusFilter = target.getAttribute('data-status');
            render();
            break;
          case 'reset-student-filters':
            state.studentSearch = '';
            state.studentStatusFilter = 'Все';
            render();
            break;
          case 'toggle-expand': {
            var eId = target.getAttribute('data-id');
            state.studentExpandedId = state.studentExpandedId === eId ? null : eId;
            render();
            break;
          }
          case 'staff-status':
            state.staffStatusFilter = target.getAttribute('data-status');
            render();
            break;
          case 'reset-staff-filters':
            state.staffSearch = '';
            state.staffStatusFilter = 'Все';
            render();
            break;
          case 'select-staff-req': {
            var sId = target.getAttribute('data-id');
            var foundReq = state.requests.find(function (r) { return r.id === sId; });
            if (foundReq) {
              state.staffSelectedId = foundReq.id;
              state.staffEditStatus = foundReq.status;
              state.staffEditComment = foundReq.staffComment;
              state.staffSaveError = null;
              state.staffSaveSuccess = null;
              render();
              if (window.innerWidth < 1024) {
                var panel = document.getElementById('staff-inspector-panel');
                if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }
            }
            break;
          }
          case 'staff-pick-status':
            state.staffEditStatus = target.getAttribute('data-status');
            state.staffSaveError = null;
            render();
            break;
          case 'staff-quick-comment':
            state.staffEditComment = target.getAttribute('data-phrase') || '';
            state.staffSaveError = null;
            render();
            break;
          case 'dismiss-toast':
            dismissToast(target.getAttribute('data-toast-id'));
            break;
          case 'toast-track':
            dismissToast(target.getAttribute('data-toast-id'));
            navigate('track', { trackNumber: target.getAttribute('data-num') || '' });
            break;
        }
      });

        switch (key) {
          case 'cert-search':
            state.certSearchQuery = el.value;

            delete state.orderFieldErrors.studentGroup;
            break;

            break;

            state.orderComment = el.value;
            break;

            break;

            state.studentSearch = el.value;

            break;

            state.draftProfileName = el.value;
            break;
          case 'draft-profile-group':
            state.draftProfileGroup = el.value;
            break;
          case 'staff-search':

            break;

            state.authName = el.value;

      });

      appRoot.addEventListener('change', function (e) {
        var el = e.target;
        if (el.getAttribute('data-change') === 'order-cert') {
          state.orderCertId = el.value;
          var cert = CERTIFICATE_MAP[el.value];
          if (cert) state.orderPurpose = cert.defaultPurpose;
          render();
        }
      });

      appRoot.addEventListener('submit', function (e) {
        e.preventDefault();
        var formId = e.target.id;

        if (formId === 'order-form') {
          var errs = {};
          if (state.orderName.trim().length < 3) errs.studentName = 'Введите ФИО полностью (минимум 3 символа).';
          if (state.orderGroup.trim().length < 2) errs.studentGroup = 'Укажите учебную группу (например, ИВТ-22-04).';
          if (!state.orderCertId || !CERTIFICATE_MAP[state.orderCertId]) errs.certificateTypeId = 'Выберите вид справки.';
          if (state.orderPurpose.trim().length < 4) errs.purpose = 'Укажите цель получения документа.';
          state.orderFieldErrors = errs;
          if (Object.keys(errs).length > 0) {
            state.orderSubmitError = 'Проверьте корректность заполнения обязательных полей.';
            render();
            return;
          }
          var res = createRequest({
            studentName: state.orderName,
            studentGroup: state.orderGroup,
            certificateTypeId: state.orderCertId,
            purpose: state.orderPurpose,
            deliveryMethod: state.orderDelivery,
            studentComment: state.orderComment
          });
          if (!res.ok) {
            state.orderSubmitError = res.error;
            render();
            return;
          }
          state.orderSubmitError = null;
          state.orderCreatedRequest = res.request;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        if (formId === 'track-form') {
          var clean = state.trackInput.trim().toUpperCase();
          if (!clean) {
            state.trackError = 'Введите номер заявки, например UD-2026-1001.';
            state.trackSearched = '';
            render();
            return;
          }
          state.trackError = null;
          state.trackSearched = clean;
          writeHashForRoute('track', clean);
          render();
        }

        if (formId === 'profile-edit-form') {
          if (state.draftProfileName.trim().length < 3 || state.draftProfileGroup.trim().length < 2) {
            state.profileError = 'Укажите корректное ФИО и номер группы.';
            render();
            return;
          }
          state.profileError = null;
          updateStudentProfile(Object.assign({}, state.studentProfile, {
            fullName: state.draftProfileName,
            group: state.draftProfileGroup
          }));
          state.editingProfile = false;
          render();
        }

        if (formId === 'staff-update-form') {
          if (!state.staffSelectedId) return;
          state.staffSaveError = null;
          state.staffSaveSuccess = null;
          var upd = updateRequestStatus({
            id: state.staffSelectedId,
            status: state.staffEditStatus,
            staffComment: state.staffEditComment
          });
          if (!upd.ok) {
            state.staffSaveError = upd.error;
            render();
            return;
          }
          state.staffSaveSuccess = 'Изменения сохранены. Статус заявки ' + upd.request.requestNumber + ' обновлён на «' + upd.request.status + '».';
          render();
        }
      });

      document.addEventListener('mousedown', function (e) {
        if (!state.notifOpen) return;
        var container = document.getElementById('notif-dropdown-container');
        if (container && !container.contains(e.target)) {
          state.notifOpen = false;
          render();
        }
      });

      window.addEventListener('hashchange', function () {
        var parsed = parseRouteFromHash();
        state.route = parsed.route;
        if (parsed.trackNumber) {
          state.trackInput = parsed.trackNumber;
          state.trackSearched = parsed.trackNumber;
        }
        render();
      });

      window.addEventListener('storage', function (event) {
        if (event.key === STORAGE_KEYS.REQUESTS) {
          state.requests = loadRequestsFromStorage().data;
          render();
        }
        if (event.key === STORAGE_KEYS.NOTIFICATIONS) {
          var nextNotifs = loadNotificationsFromStorage();
          if (nextNotifs.length > state.notifications.length && nextNotifs[0]) {
            var latest = nextNotifs[0];
            pushToast({
              title: latest.title,
              message: latest.message,
              variant: latest.status === 'Готова' ? 'success' : latest.status === 'Отклонена' ? 'error' : 'info',
              requestNumber: latest.requestNumber
            });
          }
          state.notifications = nextNotifs;
          render();
        }
        if (event.key === STORAGE_KEYS.PROFILE) {
          state.studentProfile = loadProfileFromStorage();
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
